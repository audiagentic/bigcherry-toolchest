{{define "monitor_bar"}}
<div class="monitor-stack">
    {{range .GPUs}}
    <section class="monitor-gpu" title="{{.Name}}">
        <div class="monitor-heading">
            <span>GPU{{.Index}}</span>
            <strong>{{.UtilPercent}}%</strong>
        </div>
        <div class="monitor-name">{{if .Name}}{{.Name}}{{else}}GPU {{.Index}}{{end}}</div>
        <progress value="{{.UtilPercent}}" max="100"></progress>
        <div class="monitor-metric">
            <span>VRAM</span>
            <span>{{.VRAMGB}}</span>
        </div>
        <progress value="{{.VRAMPercent}}" max="100"></progress>
        <div class="monitor-details">{{.Details}}</div>
    </section>
    {{end}}
    <div class="monitor-system">
        <div class="monitor-metric">
            <span>CPU</span>
            <span>{{printf "%.0f" .CPUPercent}}%</span>
        </div>
        <progress value="{{printf "%.0f" .CPUPercent}}" max="100"></progress>
        <div class="monitor-metric">
            <span>RAM</span>
            <span>{{.RAMGB}}</span>
        </div>
        <progress value="{{.RAMPercent}}" max="100"></progress>
    </div>
</div>
{{end}}
